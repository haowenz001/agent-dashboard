name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh community data
        # Re-collect before building so the deployed site reflects the latest
        # GitHub data. The collector degrades gracefully: a failed repository
        # (e.g. a private one) keeps its previously published values.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Monitored repos default to the keys of config/internal-contributors.json.
          MONITOR_MAX_LIST_PAGES: '40'
        run: pnpm run collect

      - name: Refresh gate data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run collect:gate

      - name: Build static site
        # Relative base keeps assets and ./data/*.json working both for
        # project pages (/<repo>/) and for a <user>.github.io root site.
        env:
          VITE_BASE: './'
        run: pnpm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
